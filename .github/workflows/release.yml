name: Release

on:
  push:
    tags:
      - 'v*'   # e.g. v2.0.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Check tag matches versionName
        run: |
          version=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      # Releases must keep the signing certificate of Krono 1.x (React Native), otherwise Android refuses
      # to install them as an update and users lose their local data. That key is the debug.keystore
      # committed at tag v1.6.5 (alias androiddebugkey, password "android"). Repo secrets:
      #   KRONO_KEYSTORE_BASE64    base64 of that keystore
      #   KRONO_KEYSTORE_PASSWORD  android
      #   KRONO_KEY_ALIAS          androiddebugkey
      #   KRONO_KEY_PASSWORD       android
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KRONO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KRONO_KEYSTORE_BASE64 secret is missing; refusing to publish an APK signed with a different key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/krono-release.jks"
          echo "KRONO_KEYSTORE_PATH=$RUNNER_TEMP/krono-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KRONO_KEYSTORE_PASSWORD: ${{ secrets.KRONO_KEYSTORE_PASSWORD }}
          KRONO_KEY_ALIAS: ${{ secrets.KRONO_KEY_ALIAS }}
          KRONO_KEY_PASSWORD: ${{ secrets.KRONO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Fails the release if the APK isn't signed with the same certificate as v1.6.5.
      # To rotate keys later, use an APK signing lineage (apksigner rotate) and update this value.
      - name: Verify signing certificate
        env:
          EXPECTED_CERT_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          # Newer apksigner prints "V2 Signer: certificate SHA-256 digest: ...", older ones "Signer #1 certificate ...".
          actual=$(grep -m1 'certificate SHA-256 digest:' signature.txt | awk '{print $NF}')
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing certificate $actual does not match the Krono 1.x certificate $EXPECTED_CERT_SHA256 (this APK could not update existing installs)."
            exit 1
          fi

      - name: Prepare release assets and notes
        run: |
          cp app/build/outputs/apk/release/app-release.apk "krono-${GITHUB_REF_NAME}.apk"
          # Pull this version's section out of CHANGELOG.md (between "## [vX]" and the next "## [").
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See CHANGELOG.md for details." > release-notes.md; fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Krono ${{ github.ref_name }}
          body_path: release-notes.md
          # app-release.apk keeps existing Obtainium/download links working; the versioned copy is for humans.
          files: |
            app/build/outputs/apk/release/app-release.apk
            krono-${{ github.ref_name }}.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload R8 mapping (for deobfuscating crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/krono-release.jks"
